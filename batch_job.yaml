name: hyperparameter-tuning-job-config
priority: 50

taskGroups:
  - taskSpec:
      runnables:
        - container:
            imageUri: gcr.io/time-series-nn-forecast-lab/hyperparameter-tuner:latest
            entrypoint: "python"
            commands:
              - "-m"
              - "src.scripts.hyperparameter_tuning"
              - "--config_path"
              - "experiment_configs/config_gru_sinusoidal_0.8-0.1.yaml"
      maxRetryCount: 1
      computeResource:
        cpuMilli: 8000  # 10 CPUs
#        cpuMilli: 20000  # 20 CPUs
#        memoryMib: 4096  # 4 GB Memory
        memoryMib: 8192  # 8 GB Memory
#        memoryMib: 16384  # 16 GB Memory
#        memoryMib: 32768  # 32 GB Memory

    taskCount: 1  # Single task

logsPolicy:
  destination: CLOUD_LOGGING