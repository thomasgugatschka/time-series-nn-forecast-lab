name: Deploy to Google Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set Google Cloud Project
      run: gcloud config set project time-series-nn-forecast-lab

    - name: Archive Project Files
      run: tar -czf project.tar.gz .

    - name: Copy Project to VM
      run: |
        gcloud compute scp project.tar.gz nn-instance:/home/runner/project.tar.gz --zone=us-central1-a
        gcloud compute ssh nn-instance --zone=us-central1-a --command="mkdir -p /home/runner/project && tar -xzf /home/runner/project.tar.gz -C /home/runner/project"

    - name: Install Dependencies and Run Experiment
      run: |
        gcloud compute ssh nn-instance --zone=us-central1-a --command="
        cd /home/runner/project &&
        if [ ! -f requirements.txt ]; then
          echo 'Error: requirements.txt not found.';
          exit 1;
        fi &&
        pip install -r requirements.txt &&
        python scripts/hyperparameter_tuning.py --config_path configs/config.yaml > experiment.log 2>&1
        "
        echo "Experiment completed. Fetching logs..."
        gcloud compute scp nn-instance:/home/runner/project/experiment.log . --zone=us-central1-a
