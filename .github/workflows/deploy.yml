name: Deploy to Google Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set Google Cloud Project
      run: gcloud config set project time-series-nn-forecast-lab

    - name: Deploy Code to VM
      run: |
        set -e
        echo "Creating target directory on VM..."
        gcloud compute ssh nn-instance --zone=us-central1-a --command="mkdir -p /home/runner/project"

        echo "Copying project files to VM..."
        gcloud compute scp --recurse "$(pwd)" nn-instance:/home/runner/project --zone=us-central1-a || {
          echo "File copy failed.";
          exit 1;
        }

        echo "Installing dependencies and running the experiment..."
        gcloud compute ssh nn-instance --zone=us-central1-a --command="
        cd /home/runner/project &&
        pip install -r requirements.txt &&
        python scripts/hyperparameter_tuning.py --config_path configs/config.yaml > experiment.log 2>&1
        "
        echo "Experiment completed. Fetching logs..."
        gcloud compute scp nn-instance:/home/runner/project/experiment.log . --zone=us-central1-a
