name: Deploy to Google Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set Google Cloud Project
      run: gcloud config set project time-series-nn-forecast-lab

    - name: Deploy Code to VM
      run: |
        # Copy code to the VM
        gcloud compute scp --recurse . nn-instance:/home/nn-user/project --zone=us-central1-a

        # SSH into the VM and set up the environment
        gcloud compute ssh nn-instance --zone=us-central1-a --command="
        cd /home/nn-user/project &&
        pip install -r requirements.txt &&
        python scripts/hyperparameter_tuning.py --config_path config.yaml
        "
