name: hyperparameter-tuning-job-config
priority: 50

taskGroups:
  - taskSpec:
      runnables:
        - container:
            imageUri: gcr.io/time-series-nn-forecast-lab/hyperparameter-tuner:latest
            commands:
              - "python"
              - "-m"
              - "src.scripts.hyperparameter_tuning"
              - "--config_path"
              - "{{CONFIG_PATH}}"
      maxRetryCount: 1
      computeResource:
#        cpuMilli: 8000  # 8 CPUs
        cpuMilli: 16000  # 16 CPUs
#        memoryMib: 8192  # 8 GB Memory
        memoryMib: 16384  # 16 GB Memory
      environment:
        variables:
          SYNC_CONFIG_FROM_GCS: "True"
          GOOGLE_APPLICATION_CREDENTIALS: "/app/service-account-key.json"
    taskCount: 1

logsPolicy:
  destination: CLOUD_LOGGING
