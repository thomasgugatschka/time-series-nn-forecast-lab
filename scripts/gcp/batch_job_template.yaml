name: hyperparameter-tuning-job-config
priority: 50

taskGroups:
  - taskSpec:
      runnables:
        - container:
            imageUri: gcr.io/time-series-nn-forecast-lab/forecast-lab-container:latest
            commands:
              - "python"
              - "-m"
              - "src.scripts.hyperparameter_tuning"
              - "--config_path"
              - "{{CONFIG_PATH}}"
      maxRetryCount: 1
      computeResource:
        cpuMilli: {{CPU_MILLI}}  # Dynamic CPU allocation
        memoryMib: {{MEMORY_MIB}}  # Dynamic memory allocation
      environment:
        variables:
          SYNC_CONFIG_FROM_GCS: "True"
          GOOGLE_APPLICATION_CREDENTIALS: "/app/service-account-key.json"
    taskCount: 1

logsPolicy:
  destination: CLOUD_LOGGING
