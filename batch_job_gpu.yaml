name: hyperparameter-tuning-gpu
priority: 1

taskGroups:
  - taskSpec:
      runnables:
        - container:
            imageUri: gcr.io/time-series-nn-forecast-lab/hyperparameter-tuner:gpu
            entrypoint: "python"
            commands:
              - "-m"
              - "src.scripts.hyperparameter_tuning"
              - "--config_path"
              - "experiment_config/config_tcn_sinusoidal_0.8-0.1.yaml"
      maxRetryCount: 2
      computeResource:
        cpuMilli: 10000       # 10 CPUs
        memoryMib: 16384      # 16 GB Memory

allocationPolicy:
  instances:
    - policy:
        machineType: n1-standard-4  # Compatible n1 machine type
        accelerators:
          - type: nvidia-tesla-t4  # GPU type
            count: 1
        provisioningModel: STANDARD

logsPolicy:
  destination: CLOUD_LOGGING
