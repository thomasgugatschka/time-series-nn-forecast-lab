sources:
#  - multivariate_sinusoidal_ns20000_nf5_st20
#  - multivariate_sinusoidal_ns200000_nf5_st100
  - multivariate_sinusoidal_ns20000_nf5_st100
#  - multivariate_sinusoidal_ns100000_nf5_st100
