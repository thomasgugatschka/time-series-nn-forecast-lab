model_type: "RNN"            # Implemented Models
dataset: "sinusoidal"
#dataset: "illness"    # Available Datasets from data folder
num_samples: 5               # Number of trials to run during hyperparameter tuning
cpu_per_trial: 10  #10           # Number of CPU cores allocated per trial
gpu_per_trial: 0.8   #0.8         # Fraction of GPU allocated per trial
max_concurrent_trials: 1      # Maximum number of trials to run concurrently

trial_params:
  max_epochs: 6             # Maximum number of epochs for training each trial
  grace_period: 5             # Minimum number of epochs before stopping underperforming trials
  reduction_factor: 2         # Factor by which the learning rate is reduced (used by some schedulers)

data_params:
  data_split:
    frac_train: 0.7
    frac_val: 0.15
    frac_test: 0.15
  time_series_window: "fixed-window" # Transformer only - "full-sequence" / "fixed-window"

search_algorithm: "optuna"    # Algorithm used for hyperparameter tuning; "optuna", "bayesopt", "random", "hyperopt"
scheduler: "asha"             # Scheduler to control the execution of trials
